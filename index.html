<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifestitchr Atlas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Lifestitchr Atlas</h1>
  <nav id="header-nav">
    <button class="nav-tab active" data-tab="All">Main Deck</button>
    <button class="nav-tab" data-tab="Resource">Resource Deck</button>
  </nav>
  <div id="starter-deck-btns">
    <span class="starter-deck-label">Starter Decks:</span>
    <button class="starter-deck-btn starter-deck-H" data-deck="Heart">Heart</button>
    <button class="starter-deck-btn starter-deck-Br" data-deck="Brain">Brain</button>
    <button class="starter-deck-btn starter-deck-S" data-deck="Soul">Soul</button>
    <button class="starter-deck-btn starter-deck-E" data-deck="Eye">Eye</button>
  </div>
</header>

<div id="layout">
  <div id="browser">
    <div id="filter-row"></div>
    <div id="grid"></div>
  </div>
  <aside id="sidebar">
    <div id="sidebar-top">
      <h2 id="sidebar-title">Your Deck</h2>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
        <span id="card-total">0 cards</span>
        <span id="deck-warning"></span>
      </div>
    </div>
    <div id="deck-breakdown"></div>
    <div id="deck-list"></div>
    <div id="sidebar-bottom">
      <div class="sidebar-btn-row">
        <button id="share-btn">Share Deck</button>
      </div>
      <div id="atlas-link-row">
        <input id="atlas-link-input" type="text" readonly>
        <button id="atlas-link-copy">Copy</button>
      </div>
      <div class="sidebar-btn-row">
        <button id="clear-btn">Clear</button>
        <button id="export-btn" disabled>Copy Atlas Link</button>
        <button id="export-resource-btn" disabled style="display:none">Copy Resource Link</button>
      </div>
    </div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
