<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>deck builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>deck builder</h1>
  <button id="refresh-btn" title="re-fetch cards from the sheet">↻ refresh cards</button>
  <span id="refresh-msg"></span>
</header>

<div id="layout">
  <div id="browser">
    <div id="tabs"></div>
    <div id="grid"></div>
  </div>
  <aside id="sidebar">
    <div id="sidebar-top">
      <h2 id="sidebar-title">your deck</h2>
      <div>
        <span id="card-total">0 cards</span>
        <span id="deck-warning"></span>
      </div>
    </div>
    <div id="deck-breakdown"></div>
    <div id="deck-list"></div>
    <div id="sidebar-bottom">
      <div class="sidebar-btn-row">
        <button id="clear-btn">clear</button>
        <button id="export-btn" disabled>export atlas</button>
        <button id="export-resource-btn" disabled style="display:none">export resource atlas</button>
      </div>
    </div>
  </aside>
</div>

<script src="app.js"></script>
</body>
</html>
